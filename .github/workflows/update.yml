name: Update catalog

on:
  schedule:
    # 毎日 6:00 JST = 前日 21:00 UTC
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore fetch caches
        uses: actions/cache@v4
        with:
          path: |
            output/catalog_by_month.json
            output/store_checks.json
            output/preview_urls.json
          key: checker-data-${{ github.run_id }}
          restore-keys: |
            checker-data-
            store-checks-

      - name: Generate full site
        env:
          PYTHONUNBUFFERED: "1"
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
        timeout-minutes: 360
        run: python main.py --limit 0 --fetch --fetch-preview

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add -- index.html sitemap.xml books logo.png search-icon.png \
            output/catalog_by_month.json output/store_checks.json output/preview_urls.json
          if git diff --staged --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Update site (catalog, privileges, previews)"
            git push
          fi
